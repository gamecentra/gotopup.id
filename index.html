<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>GOTOPUP.ID - Top Up Game</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <img src="logo.jpg"
           alt="GOTOPUP.ID"
           class="logo">

      <div class="brand-text">
        <h1>GOTOPUP.ID</h1>
        <p>Top Up Game & Entertainment</p>
      </div>

      <img src="https://flagcdn.com/w40/id.png"
           alt="Indonesia"
           class="flag">
    </div>
  </header>

  <!-- NOTIFIKASI -->
  <div class="announcement">
    <div class="announcement-text">
      WARKODE DISKON • WDP • MEMBERSHIP
      MENJADI 5 PERAK!
    </div>
  </div>

  <!-- HALAMAN UTAMA -->
  <main id="page-home" class="page active">

    <!-- BANNER SLIDER -->
    <section class="banner-section">
      <div class="banner-slider" id="bannerSlider">

        <div class="banner-track">
          <img src="banner1.png" alt="Banner 1">
          <img src="banner2.png" alt="Banner 2">
          <img src="banner3.png" alt="Banner 3">
          <img src="banner4.png" alt="Banner 4">
        </div>

      </div>
    </section>

    <!-- KATEGORI -->
    <section class="category-section">
      <h2>Kategori</h2>

      <div class="category-buttons">
        <button data-category="game">
          Game
        </button>

        <button data-category="pc">
          Game PC
        </button>

        <button data-category="entertainment">
          Entertainment
        </button>
      </div>
    </section>

    <!-- KATALOG -->
    <section class="catalog-section">
      <div class="section-heading">
        <h2>Game Populer</h2>

        <button id="showAllGames">
          Lihat Semua
        </button>
      </div>

      <div id="catalogContainer"
           class="catalog-grid">
      </div>

    </section>

  </main>
    <!-- DETAIL TOP UP -->
  <section id="page-detail" class="page">
    <button class="back-button" onclick="goHome()">
      ← Kembali
    </button>

    <div class="product-detail">
      <div class="product-info">
        <img id="detailImage" src="logo.jpg" alt="">
        <h2 id="detailName">Pilih Produk</h2>
      </div>

      <form id="topupForm">
        <div id="formFields"></div>

        <h3>Pilih Nominal</h3>
        <div id="priceList" class="price-grid"></div>

        <div class="discount-box">
          <input id="discountCode"
                 placeholder="Kode diskon">
          <button type="button"
                  onclick="applyDiscount()">
            Pakai
          </button>
          <p id="discountMessage"></p>
        </div>

        <div class="total-box">
          <span>Total Pembayaran</span>
          <strong id="totalPrice">Rp0</strong>
        </div>

        <button type="button"
                class="primary-button"
                onclick="openPayment()">
          Lanjut Pembayaran
        </button>
      </form>
    </div>
  </section>

  <!-- PEMBAYARAN -->
  <div id="paymentModal" class="modal">
    <div class="modal-content">
      <button class="modal-close"
              onclick="closePayment()">×</button>

      <h2>Pembayaran QRIS</h2>
      <img src="qris.png"
           alt="QRIS"
           class="qris-image">

      <p id="paymentAmount"></p>

      <button class="primary-button"
              onclick="confirmPayment()">
        Konfirmasi ke WhatsApp
      </button>
    </div>
  </div>
    <!-- FROM DATA -->
  <section id="page-formdata" class="page">
    <h2>From Data</h2>
    <div id="formDataContent"></div>
  </section>

  <!-- RIWAYAT -->
  <section id="page-history" class="page">
    <h2>Riwayat Transaksi</h2>
    <div id="historyContent">
      <p>Belum ada riwayat transaksi.</p>
    </div>
  </section>

  <!-- AKUN -->
  <section id="page-account" class="page">
    <div class="account-logo">
      <img src="logo.jpg" alt="GOTUPID">
      <h2>GOTUPID</h2>
    </div>

    <div class="account-menu">
      <button onclick="showAccountInfo('Pengaturan')">
        Pengaturan
      </button>

      <button onclick="openCustomerService()">
        Customer Service
      </button>

      <button onclick="showAccountInfo('Info Diskon')">
        Info Diskon
      </button>

      <button onclick="showAccountInfo('Kebijakan')">
        Kebijakan
      </button>
    </div>

    <div id="accountInfo"></div>

    <a class="cs-floating"
       href="https://wa.me/6283130951231"
       target="_blank"
       aria-label="Customer Service">
      ●
    </a>
  </section>
    <!-- NAVIGASI BAWAH -->
  <nav class="bottom-nav">
    <button class="nav-item active"
            onclick="navigatePage('home', this)">
      <span>⌂</span>
      <small>Halaman</small>
    </button>

    <button class="nav-item"
            onclick="navigatePage('formdata', this)">
      <span>▤</span>
      <small>From Data</small>
    </button>

    <button class="nav-item"
            onclick="navigatePage('history', this)">
      <span>◷</span>
      <small>Riwayat</small>
    </button>

    <button class="nav-item"
            onclick="navigatePage('account', this)">
      <span>♙</span>
      <small>Akun</small>
    </button>
  </nav>

  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
